name: Cloud Task Runner

on:
  schedule:
    - cron: "0 15 * * 0-4"
    - cron: "0 16 * * 0-4"
    - cron: "0 17 * * 0-4"
    - cron: "0 18 * * 0-4"
    - cron: "0 19 * * 0-4"
    - cron: "0 20 * * 0-4"
    - cron: "0 21 * * 0-4"
    - cron: "30 22 * * 0-4"
    - cron: "30 23 * * 0-4"
    - cron: "30 0 * * 1-5"
    - cron: "30 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "17 3 * * 1-5"
    - cron: "32 3 * * 1-5"
    - cron: "41 3 * * 1-5"
  workflow_dispatch:
    inputs:
      trade_mode:
        description: "Mode"
        required: true
        default: "LIVE"
        type: choice
        options:
          - LIVE
          - PAPER

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FYERS_ID: ${{ secrets.FYERS_ID }}
      FYERS_PIN: ${{ secrets.FYERS_PIN }}
      FYERS_TOTP_KEY: ${{ secrets.FYERS_TOTP_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Check schedule & pre-open relay
        id: dedup
        run: |
          NOW_HM=$(date +%H%M)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$NOW_HM" -ge 1525 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IN_PROG=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/live_bot.yml/runs?status=in_progress" | python3 -c "import sys, json; d=json.load(sys.stdin); print(len([r for r in d.get('workflow_runs', []) if str(r.get('id')) != '$GITHUB_RUN_ID']))" 2>/dev/null || echo "0")
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$IN_PROG" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # If a run (schedule OR workflow_dispatch) starts before 08:50 IST, sleep until 08:55 IST and dispatch a fresh 6.5h trading run!
          if [ "$NOW_HM" -lt 0850 ]; then
            TARGET_EPOCH=$(date -d "today 08:55:00" +%s)
            NOW_EPOCH=$(date +%s)
            SLEEP_SEC=$((TARGET_EPOCH - NOW_EPOCH))
            if [ "$SLEEP_SEC" -gt 0 ] && [ "$SLEEP_SEC" -lt 20400 ]; then
              echo "Pre-open relay active: sleeping $SLEEP_SEC seconds until 08:55:00 IST..."
              sleep "$SLEEP_SEC"
            fi
            RELAY=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/live_bot.yml/runs?status=in_progress&per_page=100" | python3 -c "import sys, json; me=int('$GITHUB_RUN_ID'); rs=[r for r in json.load(sys.stdin).get('workflow_runs', []) if int(r['id']) != me]; print('skip' if any(int(r['id']) < me or r.get('event') == 'workflow_dispatch' for r in rs) else 'go')" 2>/dev/null || echo "go")
            if [ "$RELAY" = "go" ]; then
              echo "Relay leader: dispatching today's trading run."
              curl -s -X POST -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/live_bot.yml/dispatches" -d '{"ref":"main","inputs":{"trade_mode":"LIVE"}}'
            else
              echo "Another relay or trading run is active: not dispatching (prevents duplicate bots)."
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            DUP=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/live_bot.yml/runs?status=in_progress&per_page=100" | python3 -c "
          import sys, json
          from datetime import datetime
          rs = json.load(sys.stdin).get('workflow_runs', [])
          me = int('$GITHUB_RUN_ID')
          mine = [r for r in rs if int(r['id']) == me]
          t = lambda r: datetime.strptime(r['created_at'], '%Y-%m-%dT%H:%M:%SZ')
          dup = bool(mine) and any(int(r['id']) < me and r.get('event') == 'workflow_dispatch' and abs((t(mine[0]) - t(r)).total_seconds()) <= 120 for r in rs)
          print('dup' if dup else 'ok')" 2>/dev/null || echo "ok")
            if [ "$DUP" = "dup" ]; then
              echo "Duplicate trading run detected (same-minute dispatch): exiting to keep exactly one bot."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout workspace
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ankurguria/algo_trading_system
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install packages
        if: steps.dedup.outputs.skip != 'true'
        run: |
          pip install -q --upgrade pip
          pip install -q -r requirements.txt

      - name: Execute session (with live sync to private repo)
        if: steps.dedup.outputs.skip != 'true'
        env:
          TRADE_MODE: ${{ inputs.trade_mode || 'LIVE' }}
          GITHUB_STEP_SUMMARY: ""
        run: |
          NOW_HM=$(date +%H%M)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$NOW_HM" -ge 1525 ]; then
            exit 0
          fi
          git config user.name "Ankur Guria"
          git config user.email "38972102+ankurguria@users.noreply.github.com"
          mkdir -p historical_data
          PRIV_LOG="historical_data/session_$(date +%Y-%m-%d).log"
          TMP_LOG="/tmp/session_$(date +%Y-%m-%d).log"
          if [ -f "$PRIV_LOG" ]; then
            cp "$PRIV_LOG" "$TMP_LOG"
          fi

          # Background live log & state pusher: copy from /tmp so git never unlinks the open stdout file descriptor!
          (
            set +e
            while true; do
              sleep 20
              if [ -f "$TMP_LOG" ]; then
                cp "$TMP_LOG" "$PRIV_LOG"
              fi
              git add "$PRIV_LOG" historical_data/engine_state_*.json 2>/dev/null
              if ! git diff --staged --quiet; then
                git commit -q -m "Live log update $(date +%H:%M:%S)"
                if ! git push -q origin main 2>/dev/null; then
                  git fetch -q origin main
                  git reset -q --mixed origin/main
                  if [ -f "$TMP_LOG" ]; then
                    cp "$TMP_LOG" "$PRIV_LOG"
                  fi
                  git add "$PRIV_LOG" historical_data/engine_state_*.json 2>/dev/null
                  git commit -q -m "Live log update $(date +%H:%M:%S)"
                  git push -q origin main
                fi
              fi
            done
          ) &
          SYNC_PID=$!

          # GitHub-hosted jobs are killed after 6 hours. Runs that start before 09:35 hand over to a
          # fresh run at 14:47 (after the 14:45 candle check); the successor restores state and finishes the day.
          if [ "$(date +%H%M)" -lt 0935 ]; then
            export HANDOFF_AT="14:47:00"
            echo "Handoff armed for $HANDOFF_AT (job started $(date +%H:%M:%S))."
          fi

          while true; do
            python -u run.py >> "$TMP_LOG" 2>&1 && break
            NOW_HM=$(date +%H%M)
            if [ "$NOW_HM" -ge 1525 ]; then
              break
            fi
            sleep 3
          done
          kill "$SYNC_PID" 2>/dev/null || true
          wait "$SYNC_PID" 2>/dev/null || true
          rm -f .git/index.lock
          if [ -f "$TMP_LOG" ]; then
            cp "$TMP_LOG" "$PRIV_LOG"
          fi

          if [ -n "${HANDOFF_AT:-}" ] && [ "$(date +%H%M%S)" -ge 144700 ] && [ "$(date +%H%M)" -lt 1520 ]; then
            echo "Handoff: pushing state, then launching successor run ($(date +%H:%M:%S))..."
            for attempt in 1 2 3; do
              git add "$PRIV_LOG" historical_data/engine_state_*.json historical_data/aggregated_data_*.feather 2>/dev/null
              git diff --staged --quiet || git commit -q -m "Handoff state $(date +%H:%M:%S)"
              if git push -q origin main; then
                echo "Handoff state pushed (attempt $attempt)."
                break
              fi
              git fetch -q origin main && git reset -q --mixed origin/main
            done
            curl -s -X POST -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/live_bot.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"trade_mode\":\"${TRADE_MODE:-LIVE}\"}}"
            echo "Successor run dispatched at $(date +%H:%M:%S)."
          fi

      - name: Final sync to private repository
        if: (success() || failure()) && steps.dedup.outputs.skip != 'true'
        run: |
          set +e
          git config user.name "Ankur Guria"
          git config user.email "38972102+ankurguria@users.noreply.github.com"
          if [ -f "/tmp/session_$(date +%Y-%m-%d).log" ]; then
            cp "/tmp/session_$(date +%Y-%m-%d).log" "historical_data/session_$(date +%Y-%m-%d).log"
          fi
          git add historical_data/*.feather historical_data/engine_state_*.json historical_data/session_*.log 2>/dev/null
          if ! git diff --staged --quiet; then
            git commit -q -m "Sync $(date +%Y-%m-%d)"
            git push -q origin main || (git fetch -q origin main && git reset -q --mixed origin/main && git add historical_data/* && git commit -q -m "Sync $(date +%Y-%m-%d)" && git push -q origin main)
          fi
